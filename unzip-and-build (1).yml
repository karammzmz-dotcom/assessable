name: Unzip and Build APK

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip any zip files in the repo root
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip files found, skipping."
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Unzipping $z"
            tmp=$(mktemp -d)
            unzip -q "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            src="$tmp"
            entries=("$tmp"/*)
            # If the zip has one top-level folder, use its contents
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            fi
            # Workflow files can't be pushed with the default token
            rm -rf "$src/.github"
            cp -a "$src"/. .
            git rm -q -f "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip project files" || echo "Nothing to commit"
          git push

      - uses: actions/setup-java@v4
        if: ${{ hashFiles('settings.gradle.kts', 'settings.gradle') != '' }}
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        if: ${{ hashFiles('settings.gradle.kts', 'settings.gradle') != '' }}
        with:
          gradle-version: 8.7

      - name: Build debug APK
        if: ${{ hashFiles('settings.gradle.kts', 'settings.gradle') != '' }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('settings.gradle.kts', 'settings.gradle') != '' }}
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
